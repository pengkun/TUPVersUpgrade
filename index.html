<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>钢琴 USB 固件升级</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="layout">
    <section class="guide">
      <h1>钢琴 USB 固件升级</h1>
      <p class="sub">请先按图示让钢琴进入升级模式，再连接 USB。</p>
      <img src="./gif_ota_1.gif" alt="升级模式指引" class="guide-image" />
    </section>

    <section class="panel">
      <div class="row">
        <button id="connectBtn">连接钢琴</button>
        <button id="checkBtn" disabled>检查更新</button>
        <button id="upgradeBtn" disabled>开始升级</button>
        <button id="pickFileBtn" disabled>选择本地固件</button>
        <input id="firmwareFileInput" type="file" accept=".upg,.txt,.octet-stream" hidden />
      </div>

      <dl class="info">
        <div><dt>连接状态</dt><dd id="connStatus">未连接</dd></div>
        <div><dt>设备名称</dt><dd id="deviceName">-</dd></div>
        <div><dt>最新版本</dt><dd id="latestVersion">-</dd></div>
        <div><dt>文件大小</dt><dd id="fileSize">-</dd></div>
      </dl>

      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="stage">空闲</span>
          <span id="percent">0%</span>
        </div>
        <div class="progress-track"><div id="bar" class="progress-bar"></div></div>
      </div>

      <pre id="releaseNote" class="release-note">更新说明：-</pre>
      <pre id="log" class="log"></pre>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
